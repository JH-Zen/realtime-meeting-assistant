name: Windows preview release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0-preview.1

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v0.1.0-preview.1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag' }
      - name: Install locked dependencies
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs');const p='package-lock.json';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replaceAll('https://registry.npmmirror.com/','https://registry.npmjs.org/'));"
          npm ci --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Check and build
        shell: pwsh
        run: |
          foreach ($task in @('typecheck', 'lint', 'build')) {
            npm run $task
            if ($LASTEXITCODE -ne 0) { throw "$task failed" }
          }
          npm test -- --maxWorkers=2
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build core installer
        shell: pwsh
        run: |
          node tools/package.mjs --tier=core --out=work/release/staged
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          node tools/make-installer.mjs --staged=work/release/staged/core --build=work/release/build --out=outputs/release --name=RCC-Core
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Verify installed application
        shell: pwsh
        run: |
          node tools/verify-installer.mjs --installer=outputs/release/RCC-Core-Setup.exe --work=work/release/smoke
          if ($LASTEXITCODE -ne 0) { throw 'Installed application verification failed' }
      - name: Prepare release metadata
        shell: pwsh
        run: |
          $installer = 'outputs/release/RCC-Core-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RCC-Core-Setup.exe" | Set-Content -LiteralPath outputs/release/SHA256SUMS.txt -Encoding utf8NoBOM
          $smoke = Get-Content -LiteralPath work/release/smoke/verification.json -Raw | ConvertFrom-Json
          @{ version=$env:RELEASE_TAG; commit=$env:GITHUB_SHA; node=(node --version); platform='win32'; arch='x64'; defaultMode='mock'; verification=$smoke } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath outputs/release/release-metadata.json -Encoding utf8NoBOM
      - name: Create release and upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists; choose a new tag' }
          gh release create $env:RELEASE_TAG outputs/release/RCC-Core-Setup.exe outputs/release/SHA256SUMS.txt outputs/release/release-metadata.json --target $env:GITHUB_SHA --title "$env:RELEASE_TAG - Windows core preview" --notes-file docs/releases/v0.1.0-preview.1.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
