<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实时会议助手（桌面预览）</title>
  <style>
    body { margin: 0; color: #e5e7eb; background: #111827; font: 16px/1.7 "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { max-width: 680px; margin: 15vh auto; padding: 40px; }
    h1 { font-size: 28px; } p { overflow-wrap: anywhere; } #logs { color: #9ca3af; font-size: 14px; }
    button { padding: 10px 20px; margin: 16px 12px 0 0; border: 1px solid #64748b; border-radius: 6px; background: #1e293b; color: white; cursor: pointer; }
    #state { color: #93c5fd; } #state.error { color: #fca5a5; }
  </style>
</head>
<body><main>
  <h1>实时会议助手</h1>
  <h2 id="state">正在启动</h2>
  <p id="message">正在启动本地后台，请稍候…</p>
  <p id="logs"></p>
  <button type="button" id="open-logs">打开日志文件夹</button>
  <button type="button" id="exit">退出应用</button>
</main><script src="status.js"></script></body>
</html>
